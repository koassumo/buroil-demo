async function open_(code){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

  try{sessionStorage.setItem(KEY,code);}catch(e){}

  document.open();document.write(html);document.close();
}
